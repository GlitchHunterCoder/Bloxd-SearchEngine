name: update-custom-games

run-name: Updating Custom Games...

on:
  schedule:
    - cron: "0 0 1 * *"
  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Update Custom Games
        run: node web-data/update.js

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add web-data/Custom-Games.json

          if git diff --cached --quiet; then
            echo "No changes to Custom-Games.json"
          else
            git commit -m "Update Custom Games data"
            git push
          fi
